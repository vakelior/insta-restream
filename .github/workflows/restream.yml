name: Instagram Live Restream

on:
  workflow_dispatch:          # manual trigger (Actions tab → Run workflow)
  schedule:                   # optional auto-run every hour (UTC)
    - cron: '0 * * * *'

concurrency:
  group: restream-single
  cancel-in-progress: true    # never run two streams at once

jobs:
  restream:
    runs-on: ubuntu-latest    # 4 vCPU / 16 GB RAM — 2x stronger than a 2-core box
    timeout-minutes: 350      # GitHub free tier caps a job at 6h; IG live caps ~4h

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg (with libx264)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify FFmpeg + hardware
        run: |
          ffmpeg -version | head -1
          echo "CPU cores: $(nproc)"
          echo "RAM: $(free -m | awk '/Mem:/ {print $2" MB"}')"

      - name: Run restream (1080p30 full-screen vertical, high quality)
        env:
          INSTA_RTMPS: ${{ secrets.INSTA_RTMPS }}
          INPUT_URL: ${{ secrets.INPUT_URL }}
          OUT_W: "1080"
          OUT_H: "1920"
          OUT_FPS: "30"
          VIDEO_BITRATE: "6000k"     # IG caps at 6000k
        run: bash restream.sh
