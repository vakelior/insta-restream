name: Instagram Live Restream

on:
  workflow_dispatch:          # manual trigger
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: restream-single
  cancel-in-progress: true

jobs:
  restream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Verify FFmpeg + hardware
        run: |
          ffmpeg -version | head -1
          echo "CPU cores: $(nproc)"

      - name: Run restream (720x1280 vertical, high quality)
        env:
          INSTA_RTMPS: ${{ secrets.INSTA_RTMPS }}
          INPUT_URL: ${{ secrets.INPUT_URL }}
          OUT_W: "720"
          OUT_H: "1280"
          OUT_FPS: "30"
          VIDEO_BITRATE: "4500k"
        run: bash restream.sh
